<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Free Will • AI Debate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .match-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .ai-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .ai-card {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 18px;
    }
    .ai-header {
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vote-yes { color: #4ade80; font-weight: bold; }
    .vote-no { color: #f87171; font-weight: bold; }
    .vote-maybe, .vote-error { color: #fbbf24; }
    .consensus {
      background: #1e1e1e;
      padding: 14px;
      border-radius: 10px;
      margin: 20px 0;
      font-size: 1.05em;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚽ Team Free Will • AI Debate</h1>
    <p>Three expert AIs (Gemini, DeepSeek, GPT) analyze the strongest Over 2.5 + BTTS opportunities in the next 24 hours.</p>

    <div style="margin: 25px 0;">
      <button id="runDebateBtn">🚀 Run Fresh AI Debate (3 Models)</button>
      <span id="status" style="margin-left: 20px; font-size: 15px;"></span>
    </div>

    <div id="debatesContainer"></div>
  </div>

  <script src="freewill.js"></script>
</body>
</html>
